x-llama-server: &llama_server
  image: ai-learning-platform-llama-server-openblas
  build:
    context: .
    dockerfile: docker/llama.cpp.openblas.Dockerfile
    args:
      LLAMA_CPP_REF: 8f48807380305a5985df78f67e29862664c9afec

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    container_name: ai-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true # Often needed for hot reload in Docker on some systems
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next # Prevent local .next from overriding container's, though we run dev so it matters less
    command: npm run dev
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./content:/app/content
      # ⚠️ SECURITY: Docker socket is mounted for sandbox service (code execution).
      # This is DEV ONLY - production (docker-compose.prod.yml) does NOT have this.
      # Risk: Container escape could lead to host takeover.
      # TODO: Consider gVisor or Firecracker for production sandboxing.
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["./entrypoint.sh"]
    depends_on:
      - db
      - redis

  # Legacy llama.cpp mentor (commented out, replaced by BitNet)
  # mentor-fast:
  #   <<: *llama_server
  #   container_name: mentor-fast
  #   restart: unless-stopped
  #   volumes:
  #     - ${MENTOR_MODEL_DIR}:/models:ro
  #   ports:
  #     - "8081:8081"
  #   command:
  #     [
  #       "--model",
  #       "/models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf",
  #       "--host",
  #       "0.0.0.0",
  #       "--port",
  #       "8081",
  #       "--threads",
  #       "16",
  #       "--threads-batch",
  #       "16",
  #       "--ctx-size",
  #       "4096",
  #       "--batch-size",
  #       "1024",
  #       "--ubatch-size",
  #       "256",
  #       "--n-predict",
  #       "320",
  #       "--flash-attn",
  #       "auto"
  #     ]

  # BitNet Mentor Services - 1.58-bit LLMs (1.37x-6.17x faster than FP16)
  mentor-fast-bitnet:
    build:
      context: .
      dockerfile: docker/bitnet.Dockerfile
    container_name: mentor-fast-bitnet
    restart: unless-stopped
    volumes:
      - ${BITNET_MODEL_DIR:-./models/bitnet}:/models:ro
      - ./docker/bitnet_api_wrapper.py:/app/bitnet_api_wrapper.py:ro
    ports:
      - "8081:8081"
    environment:
      - MODEL_PATH=/models/bitnet_b1_58-3B
      - PORT=8081
      - HOST=0.0.0.0
    working_dir: /app/BitNet
    command: ["python3", "/app/bitnet_api_wrapper.py"]

  mentor-think-bitnet:
    build:
      context: .
      dockerfile: docker/bitnet.Dockerfile
    container_name: mentor-think-bitnet
    restart: unless-stopped
    volumes:
      - ${BITNET_MODEL_DIR:-./models/bitnet}:/models:ro
      - ./docker/bitnet_api_wrapper.py:/app/bitnet_api_wrapper.py:ro
    ports:
      - "8082:8082"
    environment:
      - MODEL_PATH=/models/Llama3-8B-1.58-100B-tokens
      - PORT=8082
      - HOST=0.0.0.0
    working_dir: /app/BitNet
    command: ["python3", "/app/bitnet_api_wrapper.py"]

  db:
    image: postgres:15-alpine
    container_name: ai-db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  nginx:
    image: nginx:alpine
    container_name: ai-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # --- NOVÁ SEKCE PRO N8N ---
  n8n:
    image: n8nio/n8n:latest
    container_name: ai-n8n
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=password
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data:
  redis_data:
