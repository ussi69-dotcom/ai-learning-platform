# Redis Configuration for AI Learning Platform
# Ensures Redis always runs as MASTER, never as replica

# Persistence
save 900 1
save 300 10
save 60 10000
dir /data
dbfilename dump.rdb
appendonly yes
appendfilename "appendonly.aof"

# Network
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory
maxmemory 512mb
maxmemory-policy allkeys-lru

# Replication - CRITICAL: Ensure we're always master
# No replicaof directive = master mode by default
replica-read-only yes

# Security
protected-mode no

# Logging
loglevel notice

# Performance
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
